# Wiederverwendbarer Workflow: baut ein Add-on je Architektur auf nativem
# Runner und schiebt es nach GHCR (Tags <version> und latest).
# Wird in Phase 2 aus den Einzel-Repos aufgerufen (siehe docs/phase2.md).
name: Build add-on image

on:
  workflow_call:
    inputs:
      addon:
        description: "Path of the add-on folder (contains config.yaml and Dockerfile)"
        required: true
        type: string
      image:
        description: "Image name with {arch}, e.g. ghcr.io/owner/{arch}-addon-name"
        required: true
        type: string
      archs:
        description: "Optional override: JSON list of architectures (default: arch list of config.yaml)"
        required: false
        type: string
        default: ""

jobs:
  matrix:
    name: Read architectures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archs: ${{ steps.archs.outputs.archs }}
    steps:
      - uses: actions/checkout@v4
      - name: Architectures from config.yaml
        id: archs
        env:
          ADDON: ${{ inputs.addon }}
          OVERRIDE: ${{ inputs.archs }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "archs=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            python3 - "$ADDON/config.yaml" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          archs, inside = [], False
          for line in open(sys.argv[1]):
              if re.match(r'^arch:\s*$', line):
                  inside = True
                  continue
              if inside:
                  m = re.match(r'^\s+-\s*["\']?([A-Za-z0-9_]+)', line)
                  if m:
                      archs.append(m.group(1))
                  elif line.strip() and not line.lstrip().startswith('#'):
                      break
          if not archs:
              sys.exit("no arch list found in config.yaml")
          print("archs=" + json.dumps(archs))
          PY
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: matrix
    # Native Runner: QEMU stuerzt bei manchen Paketen ab (z. B. ldconfig).
    # armv7/armhf/i386 laufen auf amd64 (armv7/armhf per QEMU).
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.matrix.outputs.archs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version, base image and image name
        id: info
        env:
          ADDON: ${{ inputs.addon }}
          IMAGE: ${{ inputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Version aus config.yaml
          VERSION=$(grep -m1 '^version:' "$ADDON/config.yaml" | awk '{print $2}' | tr -d "\"'")
          NAME=$(grep -m1 '^name:' "$ADDON/config.yaml" | sed 's/^name:[[:space:]]*//' | tr -d "\"'")
          # BUILD_FROM aus build.yaml (build_from: <arch>: <image>) oder build.json
          BASE=""
          if [ -f "$ADDON/build.yaml" ]; then
            BASE=$(awk -v a="$ARCH" '$1==a":"{print $2}' "$ADDON/build.yaml" | tr -d "\"'")
          elif [ -f "$ADDON/build.json" ]; then
            BASE=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('build_from',{}).get(sys.argv[2],''))" "$ADDON/build.json" "$ARCH")
          fi
          {
            echo "version=$VERSION"
            echo "name=$NAME"
            echo "base=$BASE"
            echo "image=${IMAGE//\{arch\}/$ARCH}"
            case "$ARCH" in
              aarch64) echo "platform=linux/arm64" ;;
              armv7|armhf) echo "platform=linux/arm/v7" ;;
              i386) echo "platform=linux/386" ;;
              *) echo "platform=linux/amd64" ;;
            esac
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (32-bit ARM only)
        if: matrix.arch == 'armv7' || matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.addon }}
          file: ${{ inputs.addon }}/Dockerfile
          platforms: ${{ steps.info.outputs.platform }}
          push: true
          # BUILD_FROM nur setzen, wenn build.yaml eine Basis nennt
          build-args: |
            BUILD_VERSION=${{ steps.info.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
            ${{ steps.info.outputs.base != '' && format('BUILD_FROM={0}', steps.info.outputs.base) || '' }}
          labels: |
            io.hass.version=${{ steps.info.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.name=${{ steps.info.outputs.name }}
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
